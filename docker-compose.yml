version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: foa_postgres
    restart: always
    environment:
      POSTGRES_USER: foa_user
      POSTGRES_PASSWORD: foa_password_secure
      POSTGRES_DB: foa_platform
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
